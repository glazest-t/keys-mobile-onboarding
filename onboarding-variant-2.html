<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5fa">
  <title>Ключи — знакомство с приложением</title>
  <link rel="icon" href="./assets/keys-orbit-symbol-blue.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./fonts.css">
  <link rel="stylesheet" href="./app/variant-one.css">
  <link rel="stylesheet" href="./app/prototype.css">
  <script type="module" src="./app/prototype.js?v=2"></script>
</head>
<body data-onboarding-variant="2">
  <header class="prototype-header">
    <div class="prototype-brand" aria-label="Ключи"><img src="./assets/keys-orbit-symbol-blue.svg" alt=""><img src="./assets/keys-wordmark.svg" alt="Ключи"></div>
    <button type="button" class="restart" data-restart>Сначала</button>
  </header>
  <main class="prototype-stage" aria-label="Прототип онбординга">
    <section id="variantTwo" aria-label="Вариант 2">
      <div class="orbit-phone" data-phone-screen>
        <div class="orbit-slides"></div>
        <footer class="orbit-footer">
          <nav class="step-bars" aria-label="Шаг онбординга"></nav>
          <button type="button" class="orbit-primary" data-next>Дальше</button>
          <button type="button" class="orbit-secondary" data-booking>У меня уже есть бронь</button>
        </footer>
      </div>
    </section>
    <div class="review-controls"><button type="button" data-back>Назад</button><span data-step-status aria-live="polite">Шаг 1 из 3</span><span class="swipe-hint">Можно листать свайпом</span></div>
  </main>
  <dialog aria-labelledby="completion-title">
    <form method="dialog">
      <img src="./assets/keys-orbit-symbol-blue.svg" alt="" width="48" height="48">
      <p class="completion-eyebrow">КОНЕЦ ОНБОРДИНГА</p>
      <h2 id="completion-title">Переходим к поиску отеля</h2>
      <p data-completion-text>Три шага пройдены. Следующий экран приложения — поиск отеля.</p>
      <button class="dialog-primary" value="restart">Пройти ещё раз</button>
      <button class="dialog-secondary" value="back">Вернуться к последнему шагу</button>
    </form>
  </dialog>
</body>
</html>
